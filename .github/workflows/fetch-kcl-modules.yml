# King's College London modules from KCL's public module pages, for the module catalogue (tools/unis/kcl_modules.py).
name: Fetch King's modules

on:
  push:
    paths:
      - 'tools/unis/kcl_modules.py'
      - '.github/workflows/fetch-kcl-modules.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-kcl-modules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: python3 tools/unis/kcl_modules.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "kcl-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add tools/unis/out
          git commit -m "Fetch King's modules" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 3; done
