# Downloads CC0 photo-scanned textures (Poly Haven) for the intro cities into tools/city/raw/tex and commits them.
# (Map data comes from fetch-city-pbf.yml.)
name: Fetch city textures

on:
  push:
    paths:
      - 'tools/city/fetch_city.py'
      - '.github/workflows/fetch-city.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-city
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python tools/city/fetch_city.py tex
      - name: Commit
        if: always()
        run: |
          git config user.name "city-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A tools/city/raw
          git commit -m "Fetch city data" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
