# Builds the Next.js landing page (web/) as a static export and drops it into site/,
# which Cloudflare Pages serves. Commits the result back to the same branch.
name: Build landing page

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/build-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tee ../install.log
      - name: Build
        working-directory: web
        run: |
          NEXT_TELEMETRY_DISABLED=1 npm run build 2>&1 | tee ../build.log
          npm ls --depth=0 2>&1 | tee -a ../build.log || true
      - name: Copy into site/
        run: |
          test -f web/out/index.html
          rm -rf site/_next
          cp -r web/out/_next site/_next
          cp web/out/index.html site/index.html
      - name: Commit build and log
        if: always()
        run: |
          mkdir -p .ci
          { echo "status: ${{ job.status }}"; echo "sha: ${{ github.sha }}"; echo "--- build"; tail -n 200 build.log 2>/dev/null; echo "--- install"; tail -n 80 install.log 2>/dev/null; } > .ci/landing-build.txt
          git config user.name "landing-build"
          git config user.email "actions@users.noreply.github.com"
          git add .ci/landing-build.txt
          if [ "${{ job.status }}" = "success" ]; then git add -A site/_next site/index.html web/package-lock.json; fi
          git commit -m "Build landing page (${{ job.status }}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 3; done
