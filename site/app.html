<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unizy · your uni, your modules, your AI tutor</title><meta name="description" content="Notes, flashcards, topic tests, essay marking and an AI tutor for your exact modules at UCL, Imperial, LSE, Oxford, Cambridge and Queen Mary."><meta property="og:title" content="Unizy · your uni, your modules, your AI tutor"><meta property="og:description" content="Notes, flashcards, topic tests, essay marking and an AI tutor for your exact modules at UCL, Imperial, LSE, Oxford, Cambridge and Queen Mary."><meta property="og:type" content="website"><meta name="theme-color" content="#141414"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap"><style>.uz-tab:hover,.uz-group:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.16)!important}.uz-tab:active,.uz-group:active{transform:translateY(1px)}.uz-tab:focus-visible,.uz-group:focus-visible{outline:3px solid #141414;outline-offset:2px}@media (max-width:860px){.uz-side{flex:1 1 100%!important;padding:14px 12px 10px!important;gap:10px!important}.uz-side-setup,.uz-side-foot,.uz-side-lab{display:none!important}.uz-side-mods{flex-direction:row!important;overflow-x:auto;gap:6px!important;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.uz-side-mod{flex:0 0 auto;max-width:72vw;border:1.5px solid rgba(255,255,255,.35)!important;scroll-snap-align:start}.uz-side-mod span span:last-child{display:none}.uz-side-add{flex:0 0 auto;margin-top:0!important;white-space:nowrap}.uz-main{padding:16px 14px 32px!important;gap:16px!important}.uz-mod-h1{font-size:28px!important}.uz-ob-h1{font-size:38px!important}.uz-wk{flex-wrap:wrap;row-gap:6px!important}.uz-wk-l{width:100%!important}}@media (max-width:600px){.uz-groups{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:5px!important}.uz-group{flex-direction:column;justify-content:center;padding:8px 2px!important;min-height:66px!important;gap:5px!important;border-radius:14px!important}.uz-group-txt{align-items:center}.uz-group-l{font-size:14px!important}.uz-group-sub{display:none}.uz-group span[style*="position: absolute"]{top:-9px!important;right:-2px!important;font-size:10px!important;padding:2px 6px!important}}@media (max-width:400px){.uz-ob-h1{font-size:32px!important}}</style></head><body style="margin:0"><div id="root"><p style="font-family:Inter,system-ui,sans-serif;padding:40px">Loading Unizy…</p></div><noscript><p style="font-family:Inter,system-ui,sans-serif;padding:40px">Unizy needs JavaScript switched on.</p></noscript><script type="text/x-template" id="unizy-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 960px; display: flex; flex-direction: column; font-family: 'Inter', system-ui, sans-serif; color: #141414; background: {{theme.c2}}">

<sc-if value="{{isOnboarding}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; flex: 1 1 auto">
<div style="background: {{theme.c1}}; color: {{theme.on1}}; padding: 26px 40px 150px; transition: background 0.45s ease, color 0.45s ease">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.03em">unizy</span>
<sc-if value="{{notEditing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px; align-items: center">
<sc-for list="{{stepDots}}" as="d" hint-placeholder-count="3">
<span style="width: {{d.w}}px; height: 8px; border-radius: 999px; background: {{theme.on1}}; opacity: {{d.op}}"></span>
</sc-for>
<button onClick="{{account.open}}" title="{{account.title}}" style="font: inherit; font-size: 14px; font-weight: 700; margin-left: 10px; padding: 9px 16px; min-height: 40px; border-radius: 999px; border: 1.5px solid {{theme.on1}}; background: none; color: {{theme.on1}}; cursor: pointer">{{account.label}}</button>
</div>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<button onClick="{{cancelEdit}}" style="font: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid {{theme.on1}}; background: none; color: {{theme.on1}}; cursor: pointer">← Back to my dashboard</button>
</sc-if>
</div>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: -24px">
<sc-for list="{{stepTabs}}" as="st" hint-placeholder-count="3">
<button onClick="{{st.go}}" aria-disabled="{{st.disabled}}" style="font: inherit; color: {{st.fg}}; background: {{st.bg}}; border: 1.5px solid {{theme.on1}}; border-radius: 14px; padding: 10px 16px; min-height: 44px; cursor: {{st.cursor}}; text-align: left; display: flex; flex-direction: column; gap: 2px; opacity: {{st.op}}">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">{{st.label}}</span>
<span style="font-size: 14px; font-weight: 600">{{st.value}}</span>
</button>
</sc-for>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{theme.eyebrow}}">{{eyebrow}}</span>
<h1 class="uz-ob-h1" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 58px; line-height: 1; letter-spacing: -0.035em; max-width: 880px">{{headline}}</h1>
</div>
</div>
</div>
<div style="padding: 0 40px 64px; margin-top: -100px">
<div style="max-width: 1100px; margin: 0 auto; background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.12); padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<sc-if value="{{isUni}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Choose your university</h2>
<span style="font-size: 14px; color: #5C5C57">More universities coming soon</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{unis}}" as="u" hint-placeholder-count="6">
<button onClick="{{u.pick}}" style="flex: 1 1 290px; display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 16px; border: 2px solid {{u.border}}; background: {{u.bg}}; cursor: pointer; text-align: left; font: inherit; color: #141414">
<span style="width: 52px; height: 52px; border-radius: 13px; background: {{u.c1}}; color: {{u.on1}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-weight: 800; font-size: 13px; letter-spacing: 0.02em">{{u.mono}}</span>
<span style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-width: 0">
<span style="font-weight: 700; font-size: 17px">{{u.short}}</span>
<span style="font-size: 13px; line-height: 1.35; color: #5C5C57">{{u.full}}</span>
</span>
<span style="display: flex; gap: 4px; flex: 0 0 auto">
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{u.c1}}"></span>
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{u.c2}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25)"></span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isDegree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Pick your degree at {{uni.short}}</h2>
<span style="font-size: 14px; color: #5C5C57">{{degreeNote}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{degreeItems}}" as="dg" hint-placeholder-count="5">
<button onClick="{{dg.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-radius: 14px; border: 2px solid {{dg.border}}; background: {{dg.bg}}; cursor: pointer; text-align: left; font: inherit; color: #141414; flex-wrap: wrap">
<span style="font-weight: 600; font-size: 16px">{{dg.name}}</span>
<span style="display: flex; gap: 8px; align-items: center">
<span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #F1F1EC; color: #3F3F3B">{{dg.tag}}</span>
<span style="font-size: 13px; color: #5C5C57">{{dg.yearsLabel}}</span>
</span>
</button>
</sc-for>
</div>
<sc-if value="{{hasDegree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #ECECE6">
<h3 style="margin: 0; font-size: 17px; font-weight: 700; padding-top: 22px">Which year are you in?</h3>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{yearItems}}" as="yr" hint-placeholder-count="3">
<button onClick="{{yr.pick}}" style="padding: 12px 20px; min-height: 44px; border-radius: 999px; border: 2px solid {{yr.border}}; background: {{yr.bg}}; color: {{yr.fg}}; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer">{{yr.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isModules}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Choose your Year {{year}} modules</h2>
<sc-if value="{{isReal}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; color: #4E4E49">From {{uni.short}}'s official 2026/27 course pages. <a href="{{programmeUrl}}" target="_blank" rel="noopener" style="color: #141414; font-weight: 600">See the course page</a></span>
</sc-if>
<sc-if value="{{isSample}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; color: #4E4E49">Sample modules for now. Real {{uni.short}} modules are coming soon.</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; border-radius: 14px; padding: 12px 16px; background: {{creditBg}}; min-width: min(220px, 100%); box-sizing: border-box">
<span style="font-size: 18px; font-weight: 800">{{creditMain}}</span>
<span style="font-size: 13px; font-weight: 600; color: #3F3F3B">{{creditHint}}</span>
</div>
</div>

<sc-if value="{{modsLoading}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px; border-radius: 14px; background: #F6F6F2; font-size: 15px; color: #3F3F3B">{{loadingText}}</div>
</sc-if>

<sc-if value="{{showSearch}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; align-items: center; gap: 8px; border: 1px solid #DADAD4; border-radius: 999px; padding: 11px 16px; color: #5C5C57">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search modules</span>
<input type="text" onChange="{{onSearch}}" placeholder="{{searchPlaceholder}}" style="border: none; outline: none; font: inherit; font-size: 15px; flex: 1 1 auto; min-width: 0; background: transparent">
</label>
</sc-if>

<sc-for list="{{moduleGroups}}" as="grp" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-top: 4px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.02em">{{grp.title}}</h3>
<span style="font-size: 13px; color: #5C5C57">{{grp.sub}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{grp.items}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.toggle}}" style="flex: 1 1 420px; display: flex; align-items: flex-start; gap: 14px; padding: 16px; border-radius: 14px; border: 2px solid {{m.border}}; background: {{m.bg}}; cursor: {{m.cursor}}; text-align: left; font: inherit; color: #141414; opacity: {{m.opacity}}">
<span style="width: 24px; height: 24px; border-radius: {{m.boxRadius}}; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: {{m.boxBg}}; border: 2px solid {{m.boxBorder}}; color: {{theme.onBtn}}; box-sizing: border-box; margin-top: 1px">
<sc-if value="{{m.checked}}" hint-placeholder-val="{{ true }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1 1 auto">
<span style="display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap">
<span style="font-weight: 700; font-size: 15px; line-height: 1.3">{{m.name}}</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5C57; white-space: nowrap">{{m.tagLabel}}</span>
</span>
<span style="font-size: 12px; font-weight: 600; color: #4E4E49">{{m.meta}}</span>
<span title="{{m.covTip}}" style="align-self: flex-start; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: {{m.covBg}}; color: {{m.covFg}}">{{m.covLabel}}</span>
<span style="font-size: 13px; line-height: 1.45; color: #5C5C57">{{m.blurb}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px">
<sc-if value="{{showHomeLink}}" hint-placeholder-val="{{ true }}">
<a href="/" style="font-size: 15px; font-weight: 600; color: #3F3F3B; text-decoration: none; padding: 12px 0">← Back to home</a>
</sc-if>
<sc-if value="{{editingUniStep}}" hint-placeholder-val="{{ false }}">
<button onClick="{{cancelEdit}}" style="font: inherit; font-size: 15px; font-weight: 600; color: #3F3F3B; background: none; border: none; padding: 12px 0; cursor: pointer">← Cancel and go back to my dashboard</button>
</sc-if>
<sc-if value="{{showBack}}" hint-placeholder-val="{{ false }}">
<button onClick="{{goBack}}" style="font: inherit; font-size: 15px; font-weight: 600; color: #3F3F3B; background: none; border: none; padding: 12px 0; cursor: pointer">← Back</button>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<sc-if value="{{isModules}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; font-weight: 600; color: #3F3F3B">{{selSummary}}</span>
</sc-if>
<sc-if value="{{canContinue}}" hint-placeholder-val="{{ false }}">
<button onClick="{{goNext}}" style="font: inherit; font-size: 16px; font-weight: 600; padding: 15px 28px; min-height: 48px; border-radius: 999px; border: none; cursor: pointer; background: {{theme.btn}}; color: {{theme.onBtn}}">{{nextLabel}}</button>
</sc-if>
<sc-if value="{{cannotContinue}}" hint-placeholder-val="{{ true }}">
<button aria-disabled="true" style="font: inherit; font-size: 16px; font-weight: 600; padding: 15px 28px; min-height: 48px; border-radius: 999px; border: none; cursor: not-allowed; background: #E4E4DF; color: #6B6B66">{{nextLabel}}</button>
</sc-if>
</div>
</div>

</div>
</div>
</div>
</sc-if>

<sc-if value="{{isApp}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; flex: 1 1 auto; min-height: 960px; background: {{theme.tint}}">

<aside class="uz-side" style="flex: 1 1 270px; max-width: 100%; box-sizing: border-box; background: {{theme.c1}}; color: {{theme.on1}}; padding: 28px 18px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 25px; line-height: 1.08; letter-spacing: -0.02em">{{degree.name}}</span>
<span style="font-size: 14px; opacity: 0.85">{{sideSub}}</span>
</div>
<div class="uz-side-setup" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; padding: 0 8px 4px">Your setup</span>
<sc-for list="{{setupRows}}" as="sr" hint-placeholder-count="3">
<button onClick="{{sr.go}}" style="font: inherit; text-align: left; color: {{theme.on1}}; background: {{theme.hover}}; border: none; border-radius: 12px; padding: 10px 12px; min-height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8">{{sr.label}}</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{sr.value}}</span>
</span>
<span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: {{theme.on1}}; color: {{theme.c1}}; flex: 0 0 auto">{{sr.action}}</span>
</button>
</sc-for>
</div>
<div class="uz-side-mods" style="display: flex; flex-direction: column; gap: 3px">
<span class="uz-side-lab" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; padding: 0 8px 8px">Your modules</span>
<sc-for list="{{sideMods}}" as="sm" hint-placeholder-count="5">
<button class="uz-side-mod" onClick="{{sm.pick}}" style="font: inherit; font-size: 14px; font-weight: {{sm.weight}}; text-align: left; color: {{theme.on1}}; background: {{sm.bg}}; border: none; border-radius: 10px; padding: 9px 10px; min-height: 44px; cursor: pointer; display: flex; align-items: center; gap: 10px">
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{theme.on1}}; opacity: {{sm.dot}}; flex: 0 0 auto"></span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="line-height: 1.3">{{sm.name}}</span>
<span style="font-size: 11px; font-weight: 600; opacity: 0.75">{{sm.code}}</span>
</span>
</button>
</sc-for>
<button class="uz-side-add" onClick="{{goModules}}" style="font: inherit; font-size: 14px; font-weight: 600; text-align: left; color: {{theme.on1}}; background: none; border: 1px dashed {{theme.on1}}; border-radius: 10px; padding: 11px 10px; margin-top: 8px; min-height: 44px; cursor: pointer; opacity: 0.85">+ Add or remove modules</button>
</div>
<div class="uz-side-foot" style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 8px">
<a href="/" style="color: inherit; text-decoration: none"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; opacity: 0.9">unizy</span></a>
<span style="font-size: 12px; opacity: 0.8"><a href="/privacy.html" style="color: inherit">Privacy</a> · <a href="/terms.html" style="color: inherit">Terms</a></span>
</div>
</aside>

<main class="uz-main" style="flex: 999 1 560px; min-width: 0; padding: 28px 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; position: relative">

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="font-size: 13px; font-weight: 600; color: #4E4E49">{{uni.full}}</span>
<h1 class="uz-mod-h1" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.05; letter-spacing: -0.03em">{{activeMod.name}}</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{activeChips}}" as="ac" hint-placeholder-count="3">
<span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCDCD6">{{ac.label}}</span>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; position: relative">
<button onClick="{{toggleSetupMenu}}" aria-expanded="{{setupMenuOpen}}" style="font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #141414; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4"></path></svg>
<span>Change uni, course or modules</span>
</button>
<sc-if value="{{setupMenuOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 54px; right: 0; z-index: 30; width: 320px; max-width: calc(100vw - 32px); background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E2DC; box-shadow: 0 12px 40px rgba(0,0,0,0.16); padding: 8px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{setupRows}}" as="mr" hint-placeholder-count="3">
<button onClick="{{mr.go}}" style="font: inherit; text-align: left; color: #141414; background: #FFFFFF; border: none; border-radius: 12px; padding: 12px; min-height: 52px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #5C5C57">{{mr.label}}</span>
<span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{mr.value}}</span>
</span>
<span style="font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: {{theme.btn}}; color: {{theme.onBtn}}; flex: 0 0 auto">{{mr.action}}</span>
</button>
</sc-for>
</div>
</sc-if>
<button onClick="{{account.open}}" title="{{account.title}}" style="font: inherit; min-width: 44px; height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #141414; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer">{{account.label}}</button>
</div>
</div>

<nav aria-label="Main sections" style="display: flex; flex-direction: column; gap: 10px">
<div class="uz-groups" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px">
<sc-for list="{{navGroups}}" as="g" hint-placeholder-count="5">
<button class="uz-group" data-group="{{g.id}}" onClick="{{g.pick}}" aria-current="{{g.current}}" style="font: inherit; text-align: left; display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 9px; min-height: 60px; border-radius: 16px; border: 2px solid {{g.border}}; background: {{g.bg}}; color: {{g.fg}}; cursor: pointer; box-shadow: {{g.shadow}}; transition: transform 0.12s ease, box-shadow 0.12s ease; min-width: 0; position: relative">
<span style="width: 36px; height: 36px; border-radius: 11px; background: {{g.chipBg}}; color: {{g.chipFg}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{g.icon}}"></path></svg>
</span>
<span class="uz-group-txt" style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span class="uz-group-l" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1">{{g.label}}</span>
<span class="uz-group-sub" style="font-size: 12px; font-weight: 600; opacity: {{g.subOp}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.sub}}</span>
</span>
<sc-if value="{{g.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: -8px; right: 8px; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: {{g.badgeBg}}; color: {{g.badgeFg}}; border: 2px solid #FFFFFF; white-space: nowrap">{{g.badge}}</span>
</sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{showSubTabs}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button class="uz-tab" onClick="{{t.pick}}" aria-current="{{t.current}}" style="font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 5px; min-height: 42px; border-radius: 999px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; cursor: pointer">
<span style="width: 28px; height: 28px; border-radius: 999px; background: {{t.chipBg}}; color: {{t.chipFg}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
</span>
<span>{{t.label}}</span>
</button>
</sc-for>
</div>
</sc-if>
</nav>

<sc-if value="{{tOverview}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{ci.open}}" hint-placeholder-val="{{ false }}">
<section id="checkin" style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 2px solid {{theme.c1}}; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.10)">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C57">Finished a lecture</span>
<h2 style="margin: 0; font-size: 21px; font-weight: 800; line-height: 1.25">{{ci.topic}}</h2>
</div>
<span style="font-size: 14px; color: #3F3F3B">Here’s what Unizy will set up so this lecture sticks before your next assessment:</span>
<sc-if value="{{ci.hasMatch}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><span style="flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; background: {{theme.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">1</span><span><b>Suggested revision:</b> {{ci.cardsLine}}. <button onClick="{{ci.goFlash}}" style="font: inherit; font-size: 13px; font-weight: 700; border: none; background: none; padding: 0; text-decoration: underline; cursor: pointer; color: #141414">Open them</button></span></div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><span style="flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; background: {{theme.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">2</span><span><b>Practice queue:</b> {{ci.qsLine}}.</span></div>
</div>
</sc-if>
<sc-if value="{{ci.noMatch}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; background: #FFF6DA">{{ci.noMatchLine}}</span>
</sc-if>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><span style="flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; background: {{theme.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">3</span><span><b>Reviews in your Plan:</b> {{ci.reviewLine}}.</span></div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700">Anything you didn’t follow? (optional)</span>
<textarea value="{{ci.q}}" onChange="{{ci.onQ}}" placeholder="e.g. The part about … didn’t make sense to me" style="font: inherit; font-size: 15px; line-height: 1.5; min-height: 70px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #CFCFC8; resize: vertical; box-sizing: border-box; width: 100%"></textarea>
<span style="font-size: 12px; color: #5C5C57">It goes into your practice queue so you can ask {{tutorName}} about it later.</span>
</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button onClick="{{ci.confirm}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Add to my plan and queue</button>
<button onClick="{{ci.cancel}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; border-radius: 999px; border: 1.5px solid #141414; background: #FFFFFF; color: #141414; cursor: pointer">Cancel</button>
</div>
</section>
</sc-if>
<sc-if value="{{showStart}}" hint-placeholder-val="{{ true }}">
<section style="background: #141414; color: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Start here</h2>
<span style="display: flex; gap: 12px; align-items: baseline"><span style="font-size: 13px; font-weight: 700; color: #C6F432">{{startCount}}</span><button onClick="{{hideStart}}" style="font: inherit; font-size: 13px; font-weight: 600; border: none; background: none; color: #CFCFC8; text-decoration: underline; cursor: pointer; padding: 0">Hide</button></span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px">
<sc-for list="{{startRows}}" as="sr" hint-placeholder-count="5">
<div style="display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: #232320; opacity: {{sr.op}}">
<span style="flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; border: 2px solid {{sr.boxBorder}}; background: {{sr.boxBg}}; color: {{sr.boxFg}}; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; box-sizing: border-box">{{sr.mark}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0"><span style="font-size: 14px; font-weight: 700; line-height: 1.3">{{sr.label}}</span><span style="font-size: 12px; color: #BDBDB6; line-height: 1.35">{{sr.sub}}</span></span>
<sc-if value="{{sr.notDone}}" hint-placeholder-val="{{ true }}">
<button onClick="{{sr.go}}" style="flex: 0 0 auto; font: inherit; font-size: 12px; font-weight: 800; padding: 7px 11px; border-radius: 999px; border: none; background: #C6F432; color: #141414; cursor: pointer">{{sr.goLabel}}</button>
</sc-if>
</div>
</sc-for>
</div>
</section>
</sc-if>
<section style="background: #FFFFFF; border-radius: 18px; padding: 20px 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap"><h2 style="margin: 0; font-size: 18px; font-weight: 700">Is it working? Your measured progress</h2><span style="font-size: 12px; color: #5C5C57">Measured from what you do in Unizy, across all your modules</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px">
<sc-for list="{{ev.tiles}}" as="et" hint-placeholder-count="3">
<div style="border-radius: 14px; background: {{theme.tint}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">{{et.v}}</span>
<span style="font-size: 13px; font-weight: 800">{{et.label}}</span>
<span style="font-size: 12px; line-height: 1.4; color: #3F3F3B">{{et.sub}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{ev.surveyDue}}" hint-placeholder-val="{{ false }}">
<div style="border: 2px solid {{theme.c1}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 800">Compared with how you revised before Unizy, does it save you time?</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ev.svOpts}}" as="so" hint-placeholder-count="4"><button onClick="{{so.pick}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; min-height: 40px; border-radius: 999px; border: 1.5px solid #141414; background: {{so.bg}}; color: {{so.fg}}; cursor: pointer">{{so.label}}</button></sc-for></div>
<sc-if value="{{ev.svShowHours}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; font-weight: 700">Roughly how much time a week?</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ev.svHoursOpts}}" as="sh" hint-placeholder-count="5"><button onClick="{{sh.pick}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; min-height: 40px; border-radius: 999px; border: 1.5px solid #141414; background: {{sh.bg}}; color: {{sh.fg}}; cursor: pointer">{{sh.label}}</button></sc-for></div>
</sc-if>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><button onClick="{{ev.svSend}}" style="font: inherit; font-size: 14px; font-weight: 800; padding: 9px 16px; min-height: 42px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Send</button><button onClick="{{ev.svSkip}}" style="font: inherit; font-size: 13px; font-weight: 600; border: none; background: none; text-decoration: underline; cursor: pointer; color: #3F3F3B">Not now</button><span style="font-size: 12px; color: #5C5C57">Only shown as anonymous totals. It helps us prove (or improve) Unizy.</span></div>
</div>
</sc-if>
<sc-if value="{{ev.surveyDone}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5C5C57">{{ev.surveyText}}</span></sc-if>
</section>
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Year {{year}} at a glance</h2>
<span style="font-size: 13px; color: #5C5C57">{{overviewSub}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{terms}}" as="tm" hint-placeholder-count="3">
<div style="flex: 1 1 180px; border-radius: 14px; padding: 16px; background: {{tm.bg}}; color: {{tm.fg}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 16px">{{tm.name}}</span>
<span style="font-size: 13px; opacity: 0.85">{{tm.focus}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{modCards}}" as="mc" hint-placeholder-count="5">
<button onClick="{{mc.pick}}" style="flex: 1 1 210px; font: inherit; text-align: left; cursor: pointer; border-radius: 14px; padding: 14px 16px; background: #FFFFFF; border: 2px solid {{mc.border}}; color: #141414; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px; line-height: 1.3">{{mc.name}}</span>
<span style="font-size: 12px; color: #5C5C57">{{mc.meta}}</span>
</button>
</sc-for>
</div>
</section>
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Study resources for {{activeMod.name}}</h2>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button onClick="{{res.goNotes}}" style="font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1.5px solid #141414; background: #FFFFFF; color: #141414; cursor: pointer">Notes</button>
<button onClick="{{res.goFlash}}" style="font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1.5px solid #141414; background: #FFFFFF; color: #141414; cursor: pointer">Flashcards</button>
<button onClick="{{res.goQuiz}}" style="font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Topic test</button>
</div>
</div>
<span style="display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap"><span title="{{res.cov.tip}}" style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: {{res.cov.bg}}; color: {{res.cov.fg}}">{{res.cov.label}}</span><span style="font-size: 13px; line-height: 1.5; color: #4E4E49; flex: 1 1 300px">{{res.sub}}</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{res.decks}}" as="rk" hint-placeholder-count="2">
<div style="flex: 1 1 260px; border-radius: 14px; padding: 14px 16px; background: {{theme.tint}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px">{{rk.title}}</span>
<span style="font-size: 13px; color: #3F3F3B">{{rk.meta}}</span>
</div>
</sc-for>
</div>
</section>
<sc-if value="{{hasProfile}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">How {{degree.name}} works at {{uni.short}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<sc-for list="{{profile}}" as="pf" hint-placeholder-count="4">
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">{{pf.h}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #2B2B28">{{pf.body}}</p>
</div>
</sc-for>
</div>
</section>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">About this module</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #2B2B28">{{activeMod.summary}}</p>
<sc-if value="{{hasModUrl}}" hint-placeholder-val="{{ true }}">
<a href="{{activeMod.url}}" target="_blank" rel="noopener" style="font-size: 14px; font-weight: 600; color: #141414">{{catalogueLabel}}</a>
</sc-if>
</section>
<sc-if value="{{showTeaching}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">How {{degree.name}} is taught at {{uni.short}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #2B2B28">{{teaching}}</p>
</section>
</sc-if>
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 700">What you're learning, week by week</h2>
<span style="font-size: 13px; line-height: 1.5; color: #2B2B28; padding: 8px 10px; border-radius: 10px; background: {{theme.tint}}">Press <b>Finished</b> after each lecture: Unizy suggests what to revise, queues practice questions you haven’t done and schedules reviews before your next deadline.</span>
<span style="font-size: 13px; line-height: 1.5; color: #5C5C57; padding-bottom: 8px">{{weeksNote}}</span>
<sc-for list="{{weeks}}" as="wk" hint-placeholder-count="5">
<div class="uz-wk" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid #EFEFEA">
<span class="uz-wk-l" style="width: 132px; flex: 0 0 auto; font-size: 12px; font-weight: 600; color: #5C5C57">{{wk.week}}</span>
<span style="flex: 1 1 auto; font-size: 15px; font-weight: 600; line-height: 1.35">{{wk.topic}}</span>
<span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: {{wk.pillBg}}; color: {{wk.pillFg}}; white-space: nowrap">{{wk.status}}</span>
<sc-if value="{{wk.notDone}}" hint-placeholder-val="{{ true }}">
<button onClick="{{wk.check}}" aria-label="{{wk.checkAria}}" title="Finished this lecture? Queue practice and schedule reviews" style="font: inherit; font-size: 12px; font-weight: 700; padding: 6px 10px; min-height: 32px; border-radius: 999px; border: 1.5px solid #141414; background: #FFFFFF; color: #141414; cursor: pointer; white-space: nowrap">Finished</button>
</sc-if>
<sc-if value="{{wk.done}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: #E3F3E8; color: #1C5E37; white-space: nowrap">{{wk.doneLabel}}</span>
</sc-if>
</div>
</sc-for>
</section>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Topics to revise</h2>
<sc-if value="{{hasWeak}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; color: #5C5C57">From your latest topic tests (under 60%).</span>
<sc-for list="{{weakList}}" as="wl" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid #EFEFEA">
<div style="display: flex; justify-content: space-between; gap: 10px"><span style="font-size: 15px; font-weight: 700; line-height: 1.35">{{wl.name}}</span><span style="font-size: 12px; font-weight: 800; color: #7A0C1D; white-space: nowrap">{{wl.label}}</span></div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<button onClick="{{wl.flash}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; min-height: 38px; border-radius: 999px; cursor: pointer; border: 1.5px solid #141414; background: #FFFFFF; color: #141414">Flashcards</button>
<button onClick="{{wl.test}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; min-height: 38px; border-radius: 999px; cursor: pointer; border: 1.5px solid #141414; background: #FFFFFF; color: #141414">Test again</button>
<button onClick="{{wl.plan}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; min-height: 38px; border-radius: 999px; cursor: pointer; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}">Plan 3 reviews</button>
</div>
</div>
</sc-for>
</sc-if>
<sc-if value="{{noWeak}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; line-height: 1.5; color: #3F3F3B">Take a topic test and any topic under 60% shows up here, with one-click flashcards, retests and review sessions.</span>

      const isBullet = /^([-*•]|\d+[.)])\s+/.test(line);

      const dm = /^(?:\*\*)?([^:–—=]{2,90}?)(?:\*\*)?\s*(?::|\s[–—-]\s|\s=\s)\s*(.{3,})$/.exec(body);
      if (dm && !/^https?$/i.test(dm[1].trim())) { add(dm[1], dm[2]); used = true; continue; }
      if (isBullet && heading) { bullets.push('• ' + body); continue; }
      const sm = /^([A-Z][^.?!]{1,60}?)\s+(is|are|means|refers to|describes|occurs when)\s+(.{8,})$/.exec(body);
      if (sm && sm[1].split(/\s+/).length <= 8) { add(sm[1], body); continue; }
      if (heading && !isBullet) bullets.push(body);
    }
    flush();
    return out.slice(0, 300);
  }

  componentDidMount() {
    const self = this;
    const store = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('unizy:') === 0) { try { store[k] = JSON.parse(localStorage.getItem(k)); } catch (e) {} }
      }
    } catch (e) {}
    self.setState({ store });
    if (typeof fetch === 'function') {
      fetch(Component.dataUrl()).then((r) => r.json()).then((d) => self.setState({ mdata: d })).catch(() => self.setState({ dataErr: true }));
    } else self.setState({ dataErr: true });
    try {
      const c = typeof window !== 'undefined' ? window.claude : null;
      if (c && typeof c.use === 'function') {
        c.use('sample').then((fn) => {
          self.sampleFn = fn || null; self.setState({ ai: fn ? 'ready' : 'off' });
          if (fn && typeof fn.limits === 'function') fn.limits().then((l) => self.setState({ aiImages: (l && l.images) || null })).catch(() => {});
        }).catch(() => self.setState({ ai: 'off' }));
      } else self.setState({ ai: 'off' });
    } catch (e) { self.setState({ ai: 'off' }); }
  }

  componentDidUpdate() { this.ensureBanks(); }

  ensureBanks() {
    const ids = this._wantBanks || [];
    const s = this.state || {};
    const lib = s.mdata && s.mdata.library;
    if (!lib || !ids.length) return;
    this._bankLoading = this._bankLoading || {};
    const self = this;
    ids.forEach((id) => {
      const meta = lib[id];
      if (!meta || !meta.url || (s.banks && s.banks[id]) || self._bankLoading[id]) return;
      self._bankLoading[id] = true;
      fetch(meta.url).then((r) => r.json()).then((b) => {
        const banks = Object.assign({}, (self.state || {}).banks); banks[id] = b; self.setState({ banks });
      }).catch(() => { self._bankLoading[id] = false; });
    });
  }

  save(key, val) {
    const store = Object.assign({}, (this.state || {}).store); store[key] = val;
    this.setState({ store });
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  ctxText(ctx) {
    const lines = ['Module: ' + ctx.mod.name + (ctx.mod.code ? ' (' + ctx.mod.code + ')' : '') + ' — ' + ctx.uniFull + ', ' + ctx.degName + ', Year ' + ctx.year + '.'];
    if (ctx.mod.summary) lines.push('Official outline: ' + ctx.mod.summary);
    if (ctx.mod.topics && ctx.mod.topics.length) lines.push('Official topic list: ' + ctx.mod.topics.join('; '));
    if (ctx.focus && ctx.focus.name) lines.push('Focus topic: ' + ctx.focus.name + (ctx.focus.bankTitle ? ' (from the subject area ' + ctx.focus.bankTitle + ')' : ''));
    else if (ctx.libTitles && ctx.libTitles.length) lines.push('Related subject areas: ' + ctx.libTitles.join(', '));
    return lines.join('\n');
  }

      'You write revision flashcards for UK university students.',
      ctx.kn ? ctx.kn((ctx.focus && ctx.focus.name) || '', { notes: 9000, qs: 0 }) : self.ctxText(ctx), '',
      'Write 20 NEW flashcards' + (ctx.focus && ctx.focus.name ? ' on the focus topic.' : ' spread across this module.'),
      'Rules: accurate and current; pitched at this module and year; in your own words; never invent cases, statutes, studies, statistics or quotations; leave out anything you are not sure of. Write maths in plain Unicode, not LaTeX.',
      'Fronts are a term, case, principle, mechanism, formula or short question. Backs are 1–3 crisp sentences.',

      }));

  genQuestions(ctx, need) {
    const self = this, fn = this.sampleFn;
    if (!fn || need <= 0) { self.setState({ qBusy: false, qNeed: 0 }); return; }
    const batch = Math.min(6, need);
    self.setState({ qBusy: true, qNeed: need, qErr: '' });
    const levelTxt = ctx.level ? 'level ' + ctx.level + ' (one level either side is fine)' : 'a spread from 1 to 5';
    const prompt = [
      'You write exam-style practice questions for UK university students.',
      ctx.kn ? ctx.kn((ctx.focus && ctx.focus.name) || '', { notes: 9000, qs: 2500 }) : self.ctxText(ctx), '',
      'Write ' + batch + ' NEW questions' + (ctx.focus && ctx.focus.name ? ' on the focus topic.' : ' spread across this module.'),
      'Difficulty: ' + levelTxt + ' on a 1–5 scale (1 Foundation recall, 2 Core, 3 Exam standard, 4 Challenging, 5 First-class stretch). Harder means more application, analysis and evaluation.',
      'Question types allowed: ' + ctx.types.join(', ') + '.',
      'Long questions are substantial (60–200 words: problem scenarios with named fictional parties, data, numerical or clinical vignettes, or essay prompts built on a proposition) and worth 10–25 marks. Short answers are worth 2–6 marks. Multiple choice is worth 1 mark with exactly one correct answer out of four plausible options.',
      'Accuracy: correct and current; never invent cases, statutes, studies, statistics or quotations; your own words; plain Unicode for maths; no drug doses.',
      ctx.existing.length ? 'Do not repeat these existing questions: ' + ctx.existing.slice(-40).join(' | ') : '',
      'Reply with only a JSON array. Use these shapes:',
      '{"type": "mcq", "d": 1-5, "marks": 1, "q": "...", "options": ["...","...","...","..."], "answer": index of correct option, "why": "one or two sentences"}',
      '{"type": "short" or "long", "d": 1-5, "marks": number, "q": "...", "markScheme": ["one point per mark-worthy idea"], "modelAnswer": "a strong answer (40-120 words for short, 200-350 words for long)"}'
    ].join('\n');
    fn.json(prompt, { cache: false }).then((arr) => {
      const stamp = Date.now();
      const qs = (Array.isArray(arr) ? arr : []).map((q, i) => Component.normQ(q, 'ai' + stamp + '_' + i, ctx.focus ? ctx.focus.bank : null, ctx.focus ? ctx.focus.t : null)).filter(Boolean);
      const st = self.state || {};
      const key = 'unizy:' + ctx.mk + ':aiqs';
      self.save(key, ((st.store || {})[key] || []).concat(qs));
      const test = st.test;
      const live = test && test.id === ctx.testId;
      if (live) {
        const room = Math.max(0, test.target - test.qs.length);
        self.setState({ test: Object.assign({}, test, { qs: test.qs.concat(qs.slice(0, room)) }) });
      }
      const left = need - qs.length;
      if (live && left > 0 && qs.length > 0) self.genQuestions(Object.assign({}, ctx, { existing: ctx.existing.concat(qs.map((q) => q.q.slice(0, 70))) }), left);
      else self.setState({ qBusy: false, qNeed: 0 });
    }).catch((e) => self.setState({ qBusy: false, qNeed: 0, qErr: Component.errText(e) }));
  }

  static normQ(q, id, bank, t) {
    if (!q || !q.q) return null;
    const type = q.type === 'mcq' || q.type === 'short' || q.type === 'long' ? q.type : null;
    if (!type) return null;
    const out = { id, bank: bank || null, t: Number.isFinite(+q.t) && bank ? +q.t : (t === undefined ? null : t), type, d: Math.max(1, Math.min(5, +q.d || 3)), marks: Math.max(1, +q.marks || (type === 'mcq' ? 1 : type === 'short' ? 4 : 15)), q: String(q.q) };
    if (type === 'mcq') {
      if (!Array.isArray(q.options) || q.options.length < 2 || !Number.isFinite(+q.answer)) return null;
      out.options = q.options.map(String); out.answer = +q.answer; out.why = String(q.why || ''); out.marks = 1;
    } else {
      out.markScheme = Array.isArray(q.markScheme) ? q.markScheme.map(String) : [];
      out.modelAnswer = String(q.modelAnswer || '');
    }
    return out;
  }

  markAnswer(ctx) {
    const self = this, fn = this.sampleFn;
    if (!fn) return;
    const patch = (p) => { const m = Object.assign({}, (self.state || {}).marks); m[ctx.q.id] = Object.assign({}, m[ctx.q.id], p); self.setState({ marks: m }); };
    patch({ busy: true, err: '' });
    const q = ctx.q;
    const prompt = [
      'You are an experienced UK university examiner at ' + ctx.uniFull + ' marking a Year ' + ctx.year + ' student’s answer.',
      ctx.kn ? ctx.kn(q.q + ' ' + ctx.answer.slice(0, 1500), { notes: 9000, qs: 0 }) : self.ctxText(ctx), '',
      'Question (' + q.marks + ' marks):', q.q, '',
      q.markScheme && q.markScheme.length ? 'Mark scheme (credit valid alternatives too):\n- ' + q.markScheme.join('\n- ') : 'No mark scheme is given: mark against what a strong answer at this level must contain.',
      q.modelAnswer ? '\nModel answer (for reference; the wording need not match):\n' + q.modelAnswer : '',
      '', 'Student’s answer:', '"""' + ctx.answer.slice(0, 12000) + '"""', '',
      'Mark strictly but fairly out of ' + q.marks + ', as a real examiner would. Credit accurate points the scheme does not list; give no credit for irrelevant or wrong material.',
      'Reply with only JSON: {"score": integer 0-' + q.marks + ', "band": "short label such as 2:1 standard", "got": ["points the answer earned"], "missed": ["important points it missed"], "feedback": "2-4 sentences on accuracy, depth and structure", "improve": "one specific next step"}'
    ].join('\n');
    fn.json(prompt, { cache: false }).then((r) => {
      const score = Math.max(0, Math.min(q.marks, Math.round(+((r || {}).score) || 0)));
      patch({ busy: false, done: true, by: 'ai', score, band: String(r.band || ''), feedback: String(r.feedback || ''), got: (Array.isArray(r.got) ? r.got : []).map(String).slice(0, 12), missed: (Array.isArray(r.missed) ? r.missed : []).map(String).slice(0, 12), improve: String(r.improve || '') });
    }).catch((e) => patch({ busy: false, err: Component.errText(e) }));
  }

  tutorAsk(ctx) {
    const self = this, fn = this.sampleFn;
    const text = String(ctx.text || '').trim();
    if (!fn || !text || (self.state || {}).tBusy) return;
    const all = Object.assign({}, (self.state || {}).tchat);
    const turns = (all[ctx.mk] || []).concat([{ role: 'user', content: text }]);
    all[ctx.mk] = turns;
    self.setState({ tchat: all, tInput: '', tBusy: true, tStream: '', tErr: '' });
    // Keep the main course knowledge the same for the whole chat session so it can be cached (much cheaper),
    // and add a small set of notes picked for each new question.
    self._tPack = self._tPack || {};
    let pack = self._tPack[ctx.mk];
    if (!pack || Date.now() - pack.at > 25 * 60 * 1000) { pack = { at: Date.now(), text: ctx.kn ? ctx.kn(text, { notes: 16000, qs: 3000 }) : self.ctxText(ctx) }; self._tPack[ctx.mk] = pack; }
    else pack.at = Date.now();
    const extra = ctx.kn && turns.length > 1 ? ctx.kn(text, { notes: 3500, qs: 0 }) : '';
    const rules = [
      'You are ' + ctx.tutorName + ', the Unizy AI tutor for ' + ctx.mod.name + ' on ' + ctx.degName + ' at ' + ctx.uniFull + '. You are a friendly cat in ' + ctx.uniShort + ' colours ' + (ctx.isMed ? 'wearing a stethoscope' : 'wearing a professor’s mortarboard') + ', but you answer as a rigorous, patient university ' + (ctx.isMed ? 'clinical teacher' : 'tutor') + ': explain clearly, use examples from this course, check understanding, and point the student to the right topic. Keep cat jokes to a rare light touch.',
      'Ground every answer in the COURSE KNOWLEDGE below, which is this module’s official outline and the checked Unizy library notes and mark schemes for it. Teach it the way ' + ctx.uniShort + ' teaches it at Year ' + ctx.year + ' level. If the question goes beyond the knowledge, answer from established knowledge and say so.',
      '=== COURSE KNOWLEDGE ===', pack.text, '=== END ===',
      'Stay accurate and current. Never invent cases, statutes, studies, statistics or quotations; say when you are unsure. Plain Unicode for maths. No drug doses. Keep answers focused (usually under 250 words) unless asked for more.',
      'SOURCES. Students must be able to check where your answer comes from. In the answer, put “(general knowledge)” straight after any claim that is not supported by the COURSE KNOWLEDGE. Then end with one final line that starts with “SOURCES:” and lists, separated by semicolons, only what you actually used: “Outline” for the official module outline or topic list; “Library: ” followed by the exact note title after ## for each Unizy library note; “Your notes: ” followed by the title for the student’s own notes; and “General knowledge” if anything went beyond the COURSE KNOWLEDGE. Never list a source you did not use.'
    ].join('\n');
    const sent = turns.slice(-12).map((t) => ({ role: t.role, content: String(t.content).slice(0, 4000) }));
    if (extra && sent.length) sent[sent.length - 1] = { role: 'user', content: sent[sent.length - 1].content + '\n\n(More course notes relevant to this question:\n' + extra.slice(0, 6000) + ')' };
    fn([{ role: 'user', content: rules }].concat(sent), { cache: true, onText: (u) => self.setState({ tStream: u.text }) })
      .then((r) => { const a = Object.assign({}, (self.state || {}).tchat); a[ctx.mk] = (a[ctx.mk] || []).concat([{ role: 'assistant', content: r.text }]); self.setState({ tchat: a, tBusy: false, tStream: '' }); })
      .catch((e) => self.setState({ tBusy: false, tStream: '', tErr: Component.errText(e) }));
  }

  assessWork(ctx) {
    const self = this, fn = this.sampleFn;
    if (!fn || this._asCtl) return;
    const ctl = new AbortController(); this._asCtl = ctl;
    const files = (ctx.files || []).map((f) => f.file).filter(Boolean);
    self.setState({ asBusy: true, asErr: '', asStream: 0, asSelf: false });
    const kindTxt = { question: 'an answer to an exam-style question', essay: 'an essay or coursework assignment', problem: 'a worked problem, case or calculation' }[ctx.kind] || 'a piece of work';
    const prompt = [
      'You are ' + ctx.tutorName + ', an experienced examiner at ' + ctx.uniFull + '. Mark ' + kindTxt + ' by a Year ' + ctx.year + ' student on ' + ctx.degName + ', for the module ' + ctx.mod.name + (ctx.mod.code ? ' (' + ctx.mod.code + ')' : '') + '.',
      'Mark it as a ' + ctx.uniShort + ' examiner for this module would, at Year ' + ctx.year + ' standard, using the COURSE KNOWLEDGE below (the official module outline and checked Unizy library notes and mark schemes). Where the work conflicts with that knowledge or with established fact, flag it under accuracy with the correction. Do not invent cases, statutes, studies, statistics or quotations. Plain Unicode for maths. No drug doses.',
      '', '=== COURSE KNOWLEDGE ===', ctx.knowledge, '=== END ===', '',
      ctx.title ? 'Question or title set:\n' + ctx.title : 'No question was given: infer the task from the work and say what you assumed in the summary.',

      'Be specific, honest and constructive, like a good personal tutor: name exactly what would lift the mark. Quote the student’s own words in comments.',

      '{"percent": 0-100, "band": "band label from the scale", "score": ' + (ctx.marks ? 'integer marks out of ' + ctx.marks : 'null') + ', "summary": "3-5 sentences: overall verdict, the main strength, the main weakness", "criteria": [{"name": "criterion", "percent": 0-100, "band": "band label", "comment": "1-3 sentences"}], "strengths": ["3-5 specific strengths"], "improvements": ["3-6 specific, actionable improvements"], "accuracy": ["each factual, legal, clinical or mathematical error with the correction; empty if none"], "comments": [{"quote": "a short exact quote from the work", "comment": "your comment"}], "rewrite": {"original": "one weak sentence or short passage, quoted exactly", "improved": "your stronger version"}, "nextSteps": ["2-4 topics to revise, named as in the course knowledge"], "transcription": "' + (files.length ? 'the full transcription of the photos' : '') + '"}'
    ].filter((x) => x !== '').join('\n');

    if (files.length) opts.images = files;
    fn.json(prompt, opts).then((r) => {
      self._asCtl = null;
      r = r || {};
      const num = (v, lo, hi) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : null; };
      const arr = (v, n) => (Array.isArray(v) ? v : []).map((x) => typeof x === 'string' ? x : (x && (x.text || x.point)) || '').filter(Boolean).slice(0, n);
      const res = {
        percent: num(r.percent, 0, 100) || 0, band: String(r.band || ''), score: ctx.marks ? num(r.score, 0, +ctx.marks) : null,
        summary: String(r.summary || ''),
        criteria: (Array.isArray(r.criteria) ? r.criteria : []).filter((c) => c && c.name).slice(0, 7).map((c) => ({ name: String(c.name), percent: num(c.percent, 0, 100) || 0, band: String(c.band || ''), comment: String(c.comment || '') })),

    }).catch((e) => {
      self._asCtl = null;
      self.setState({ asBusy: false, asStream: 0, asErr: e && e.code === 'cancelled' ? 'Stopped.' : e && e.code === 'images_unavailable' ? 'Photos can’t be sent from this view. Type or paste your work instead.' : e && e.code === 'image_rejected' ? 'One of the photos couldn’t be read. Try a clearer JPEG or PNG.' : e && e.code === 'prompt_too_large' ? 'That’s too long to mark in one go. Submit it in sections.' : Component.errText(e) });
    });
  }

      quiz: (id, n) => allQs.filter((qq) => qq.type === 'mcq' && (id === 'all' || (qq.bank === bankOf(id).bank && qq.t === bankOf(id).t)))
        .map((x) => [Math.random(), x]).sort((a, b) => a[0] - b[0]).slice(0, n || 5)
        .map((p) => ({ q: p[1].q.slice(0, 600), options: p[1].options.map((o) => String(o).slice(0, 300)), answer: p[1].answer, why: String(p[1].why || '').slice(0, 600) })),
      notes: myNotes.filter((n) => String(n.body || '').trim()).slice(0, 30).map((n) => ({ id: n.id, title: n.title || 'Untitled page' })),
      note: (id) => { const n = myNotes.find((x) => x.id === id); return n ? { title: n.title || 'Untitled page', body: String(n.body || '').slice(0, 12000) } : null; },
      saveCards: (cards, from) => { const ts = Date.now(); self.save('unizy:' + mk + ':mine', myCards.concat(cards.map((c, i) => ({ id: 'm' + ts + '_' + i, t: null, bank: null, f: String(c.f), b: String(c.b) + (from ? '\n(shared by ' + from + ')' : ''), d: 1, src: 'mine' })))); },
      saveNote: (title, body, from) => { saveNotes([{ id: 'p' + Date.now(), folder: myFoldersList[0], title: (from ? 'From ' + from + ': ' : '') + title, body: String(body || ''), updated: new Date().toISOString() }].concat(myNotes)); }
    };

    // ---- five core actions ----
    const NAV = [
      { id: 'learn', label: 'Learn', sub: 'Course & notes', icon: ICONS.overview, tabs: [['overview', 'Overview'], ['notes', 'Notes']] },
      { id: 'practise', label: 'Practise', sub: 'Tests & marking', icon: ICONS.quiz, tabs: [['quiz', 'Topic tests'], ['assess', 'Assess practice']] },
      { id: 'revise', label: 'Revise', sub: 'Flashcards', icon: ICONS.flash, tabs: [['flash', 'Flashcards']] },
      { id: 'plan', label: 'Plan', sub: 'Week & deadlines', icon: ICONS.time, tabs: [['time', 'Plan']] },
      { id: 'ask', label: 'Ask', sub: tutorName + ' & groups', icon: ICONS.tutor, tabs: [['tutor', tutorName], ['friends', 'Friend groups']] }
    ];
    const curGroup = NAV.find((g) => g.tabs.some((t) => t[0] === tab)) || NAV[0];
    const lightTheme = String(theme.onBtn).toUpperCase() !== '#FFFFFF';
    const strong = lightTheme ? theme.onBtn : theme.btn, onStrong = lightTheme ? '#FFFFFF' : theme.onBtn;
    const badgeOf = { revise: dueCards.length ? dueCards.length + ' due' : '', practise: queueQs.length ? queueQs.length + ' queued' : (weakList.length ? weakList.length + ' weak' : ''), plan: upcoming.length && daysFrom(planItems.filter((x) => x.kind === 'deadline' && !x.done && daysFrom(x.date) >= 0).sort((a, b) => (a.date < b.date ? -1 : 1))[0].date) <= 7 ? 'Deadline soon' : '' };
    const navGroups = NAV.map((g) => {
      const on = g === curGroup;
      return {
        id: g.id, label: g.label, sub: g.sub, icon: g.icon, current: on ? 'page' : 'false',
        bg: on ? strong : '#FFFFFF', fg: on ? onStrong : '#141414', border: on ? strong : '#DADAD4', subOp: on ? 0.85 : 0.65,
        chipBg: on ? onStrong : theme.tint, chipFg: on ? strong : '#141414',
        shadow: on ? '0 6px 16px rgba(0,0,0,0.22)' : '0 2px 0 rgba(0,0,0,0.06)',
        badge: badgeOf[g.id] || '', hasBadge: !!badgeOf[g.id], badgeBg: on ? onStrong : strong, badgeFg: on ? strong : onStrong,
        pick: () => { if (!on) set({ tab: g.tabs[0][0] }); }
      };
    });
    const tabs = curGroup.tabs.length > 1 ? curGroup.tabs.map(([id, label]) => {
      const on = id === tab;
      return { label, icon: ICONS[id], current: on ? 'page' : 'false', bg: on ? theme.tint : '#FFFFFF', fg: '#141414', border: on ? strong : '#DADAD4', chipBg: on ? strong : theme.tint, chipFg: on ? onStrong : '#141414', shadow: 'none', pick: () => set({ tab: id }) };
    }) : [];

    return {
      theme, uni: uni || { short: '', full: '' }, degree: degree || { name: '', tag: '' }, year: year || 1,
      isOnboarding: screen !== 'app', isApp: screen === 'app',
      isUni: screen === 'uni', isDegree: screen === 'degree', isModules: screen === 'modules',
      stepDots, eyebrow, headline, nextLabel,
      canContinue, cannotContinue: !canContinue, showBack: !!back,
      goNext: () => { if (canContinue && next) set(next === 'app' ? { screen: next, editing: false, saved: null } : { screen: next }); },
      editing, notEditing: !editing, cancelEdit, stepTabs, setupRows,
      showHomeLink: screen === 'uni' && !editing, editingUniStep: screen === 'uni' && editing,
      setupMenuOpen: !!get('setupMenu', false), toggleSetupMenu: () => set({ setupMenu: !get('setupMenu', false) }),
      goBack: () => { if (back) set({ screen: back }); },
      unis, degreeItems, yearItems, hasDegree: !!degree,
      degreeNote: 'Modules from ' + (uni ? uni.short : 'the university') + '’s official 2026/27 course pages',

      isReal: !!degData, isSample: false, programmeUrl: (degData && degData.url) || '#',
      modsLoading: modsLoading || noData || (!!degree && !!s.dataErr),
      loadingText: s.dataErr ? 'Couldn’t load the module list. Check your connection and reopen this step.' : noData ? 'Modules for this degree are being added. Check back soon.' : 'Loading ' + (uni ? uni.short : '') + '’s module list…',
      showSearch: !modsLoading && mods.length > 8,
      searchPlaceholder: 'Search ' + mods.length + ' modules by name, code or topic',
      onSearch: (e) => set({ q: e && e.target ? e.target.value : '' }),
      moduleGroups, creditMain, creditHint, creditBg,
      selSummary: selMods.length + ' selected' + (usesCredits && !modsLoading ? ' · ' + fmtCr(selCredits) : ''),
      sideSub: (uni ? uni.short : '') + ' · Year ' + (year || 1) + (usesCredits ? ' · ' + fmtCr(selCredits) : ''),
      overviewSub: selMods.length + ' modules' + (usesCredits ? ' · ' + fmtCr(selCredits) : ''),

      tabs, navGroups, showSubTabs: tabs.length > 1, sideMods, modCards,
      shareKit,
      ev: evidence,
      ci, startRows, showStart, startCount: startDone + ' of ' + startRows.length + ' done', hideStart: () => bumpStart({ hidden: 1 }),
      weakList, hasWeak: weakList.length > 0, noWeak: weakList.length === 0, pqv, upcoming, hasUpcoming: upcoming.length > 0,
      goPractise: () => set({ tab: 'quiz', test: null }), goPlan: () => set({ tab: 'time' }), activeMod: Object.assign({ codeOrName: activeMod.code || activeMod.name }, activeMod),
      activeChips, hasModUrl: !!activeMod.url, catalogueLabel: 'Open ' + (activeMod.code || activeMod.name) + ' on ' + (uni ? uni.short : 'the university') + '’s course pages',
      selCount: selMods.length, selCredits,
      goModules: () => startEdit('modules'), goUni: () => startEdit('uni'),
      tOverview: tab === 'overview', tNotes: tab === 'notes', tQuiz: tab === 'quiz', tFlash: tab === 'flash', tTime: tab === 'time', tFriends: tab === 'friends', tTutor: tab === 'tutor',
      terms, weeks: weeksX, weeksNote, hasTeaching, showTeaching: hasTeaching && !(degData && degData.profile && degData.profile.length), teaching: hasTeaching ? degData.teaching : '',

      nt, res, profile: profile.map((x) => ({ h: x.h, body: x.body })), hasProfile: profile.length > 0,

      fc, tq, cq, tr,

      pl,

      groups, groupName: GROUPS[groupIdx].name, groupHasChat: groupIdx === 0, groupNoChat: groupIdx !== 0, chat,
      chatPlaceholder: 'Message the group, or type @' + tutorName,

      meInfo: { uni: uni ? uni.id : null, uniShort: uni ? uni.short : '', degree: degree ? degree.id : null, degreeName: degree ? degree.name : '', year: year || 1, isMed },
      tutorName, tutorMono, tutorSub, tutorKnows, knowMods, tchat, tutorSources: sourceList, mascotMed: isMed, mascotProf: !isMed, tAssess: tab === 'assess', as,
      tBusy: !!s.tBusy, tStreamText: String(s.tStream || 'Thinking…').replace(/\n*[ \t*_]*SOURCES?:[\s\S]*$/i, ''), tHasErr: !!s.tErr, tErrText: s.tErr || '',
      tInput: get('tInput', ''), onTInput: (e) => set({ tInput: e && e.target ? e.target.value : '' }),
      tutorSend: () => ask(get('tInput', '')),
      tutorChips: chips.map((c) => ({ label: c, pick: () => ask(c) })),
      tutorPlaceholder: 'Ask ' + tutorName + ' anything about ' + activeMod.name,
      aiPill: aiReady ? 'Live' : aiState === 'pending' ? 'Connecting…' : 'Log in for AI', aiPillBg: aiReady ? '#E3F3E8' : '#F0F0EB',

      toastOn, hideToast: () => set({ toastMsg: null }),
