<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unizy · your uni, your modules, your own tutor</title><meta name="description" content="Notes, flashcards, topic tests, essay marking and a personal tutor for your exact modules at UCL, Imperial, LSE, Oxford, Cambridge and Queen Mary."><meta property="og:title" content="Unizy · your uni, your modules, your own tutor"><meta property="og:description" content="Notes, flashcards, topic tests, essay marking and a personal tutor for your exact modules at UCL, Imperial, LSE, Oxford, Cambridge and Queen Mary."><meta property="og:type" content="website"><meta name="theme-color" content="#17302A"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,500..700&family=DM+Mono:wght@400;500&display=swap"><style>.uz-tab:hover,.uz-group:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.16)!important}.uz-tab:active,.uz-group:active{transform:translateY(1px)}.uz-tab:focus-visible,.uz-group:focus-visible{outline:3px solid #17302A;outline-offset:2px}@media (max-width:860px){.uz-side{flex:1 1 100%!important;padding:14px 12px 10px!important;gap:10px!important}.uz-side-setup,.uz-side-foot,.uz-side-lab{display:none!important}.uz-side-mods{flex-direction:row!important;overflow-x:auto;gap:6px!important;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.uz-side-mod{flex:0 0 auto;max-width:72vw;border:1.5px solid rgba(255,255,255,.35)!important;scroll-snap-align:start}.uz-side-mod span span:last-child{display:none}.uz-side-add{flex:0 0 auto;margin-top:0!important;white-space:nowrap}.uz-main{padding:16px 14px 32px!important;gap:16px!important}.uz-mod-h1{font-size:28px!important}.uz-ob-h1{font-size:38px!important}.uz-wk{flex-wrap:wrap;row-gap:6px!important}.uz-wk-l{width:100%!important}}@media (max-width:600px){.uz-groups{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important}.uz-group{flex-direction:column;justify-content:center;padding:8px 2px!important;min-height:66px!important;gap:5px!important;border-radius:14px!important}.uz-group-txt{align-items:center}.uz-group-l{font-size:14px!important}.uz-group-sub{display:none}.uz-group span[style*="position: absolute"]{top:-9px!important;right:-2px!important;font-size:10px!important;padding:2px 6px!important}}@media (max-width:400px){.uz-ob-h1{font-size:32px!important}}@keyframes uzspin{to{transform:rotate(360deg)}}</style><link rel="stylesheet" href="/assets/app.css?v=9"></head><body style="margin:0"><div id="root"><p style="font-family:DM Sans,system-ui,sans-serif;padding:40px">Loading Unizy…</p></div><noscript><p style="font-family:DM Sans,system-ui,sans-serif;padding:40px">Unizy needs JavaScript switched on.</p></noscript><script type="text/x-template" id="unizy-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:opsz,wght@9..144,500..700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 960px; display: flex; flex-direction: column; font-family: DM Sans, system-ui, sans-serif; color: #17302A; background: {{theme.c2}}">

<sc-if value="{{isOnboarding}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; flex: 1 1 auto">
<div style="background: {{theme.c1}}; color: {{theme.on1}}; padding: 26px 40px 150px; transition: background 0.45s ease, color 0.45s ease">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.03em">unizy</span>
<sc-if value="{{notEditing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px; align-items: center">
<sc-for list="{{stepDots}}" as="d" hint-placeholder-count="3">
<span style="width: {{d.w}}px; height: 8px; border-radius: 999px; background: {{theme.on1}}; opacity: {{d.op}}"></span>
</sc-for>
<button onClick="{{account.open}}" title="{{account.title}}" style="font: inherit; font-size: 14px; font-weight: 700; margin-left: 10px; padding: 9px 16px; min-height: 40px; border-radius: 999px; border: 1.5px solid {{theme.on1}}; background: none; color: {{theme.on1}}; cursor: pointer">{{account.label}}</button>
</div>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<button onClick="{{cancelEdit}}" style="font: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid {{theme.on1}}; background: none; color: {{theme.on1}}; cursor: pointer">← Back to my dashboard</button>
</sc-if>
</div>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: -24px">
<sc-for list="{{stepTabs}}" as="st" hint-placeholder-count="3">
<button onClick="{{st.go}}" aria-disabled="{{st.disabled}}" style="font: inherit; color: {{st.fg}}; background: {{st.bg}}; border: 1.5px solid {{theme.on1}}; border-radius: 14px; padding: 10px 16px; min-height: 44px; cursor: {{st.cursor}}; text-align: left; display: flex; flex-direction: column; gap: 2px; opacity: {{st.op}}">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">{{st.label}}</span>
<span style="font-size: 14px; font-weight: 600">{{st.value}}</span>
</button>
</sc-for>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{theme.eyebrow}}">{{eyebrow}}</span>
<h1 class="uz-ob-h1" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 58px; line-height: 1; letter-spacing: -0.035em; max-width: 880px">{{headline}}</h1>
</div>
</div>
</div>
<div style="padding: 0 40px 64px; margin-top: -100px">
<div style="max-width: 1100px; margin: 0 auto; background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.12); padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<sc-if value="{{isUni}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Choose your university</h2>
<span style="font-size: 14px; color: #5D6D67">More universities coming soon</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{unis}}" as="u" hint-placeholder-count="6">
<button onClick="{{u.pick}}" style="flex: 1 1 290px; display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 16px; border: 2px solid {{u.border}}; background: {{u.bg}}; cursor: pointer; text-align: left; font: inherit; color: #17302A">
<span style="width: 52px; height: 52px; border-radius: 13px; background: {{u.c1}}; color: {{u.on1}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-weight: 800; font-size: 13px; letter-spacing: 0.02em">{{u.mono}}</span>
<span style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-width: 0">
<span style="font-weight: 700; font-size: 17px">{{u.short}}</span>
<span style="font-size: 13px; line-height: 1.35; color: #5D6D67">{{u.full}}</span>
</span>
<span style="display: flex; gap: 4px; flex: 0 0 auto">
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{u.c1}}"></span>
<span style="width: 14px; height: 14px; border-radius: 999px; background: {{u.c2}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25)"></span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isDegree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Pick your degree at {{uni.short}}</h2>
<span style="font-size: 14px; color: #5D6D67">{{degreeNote}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{degreeItems}}" as="dg" hint-placeholder-count="5">
<button onClick="{{dg.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-radius: 14px; border: 2px solid {{dg.border}}; background: {{dg.bg}}; cursor: pointer; text-align: left; font: inherit; color: #17302A; flex-wrap: wrap">
<span style="font-weight: 600; font-size: 16px">{{dg.name}}</span>
<span style="display: flex; gap: 8px; align-items: center">
<span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #F1F3F1; color: #34463F">{{dg.tag}}</span>
<span style="font-size: 13px; color: #5D6D67">{{dg.yearsLabel}}</span>
</span>
</button>
</sc-for>
</div>
<sc-if value="{{hasDegree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #E8ECE9">
<h3 style="margin: 0; font-size: 17px; font-weight: 700; padding-top: 22px">Which year are you in?</h3>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{yearItems}}" as="yr" hint-placeholder-count="3">
<button onClick="{{yr.pick}}" style="padding: 12px 20px; min-height: 44px; border-radius: 999px; border: 2px solid {{yr.border}}; background: {{yr.bg}}; color: {{yr.fg}}; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer">{{yr.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isModules}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Choose your Year {{year}} modules</h2>
<sc-if value="{{isReal}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; color: #4B5C56">From {{uni.short}}'s official 2026/27 course pages. <a href="{{programmeUrl}}" target="_blank" rel="noopener" style="color: #17302A; font-weight: 600">See the course page</a></span>
</sc-if>
<sc-if value="{{isSample}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; color: #4B5C56">Sample modules for now. Real {{uni.short}} modules are coming soon.</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; border-radius: 14px; padding: 12px 16px; background: {{creditBg}}; min-width: min(220px, 100%); box-sizing: border-box">
<span style="font-size: 18px; font-weight: 800">{{creditMain}}</span>
<span style="font-size: 13px; font-weight: 600; color: #34463F">{{creditHint}}</span>
</div>
</div>

<sc-if value="{{cx.imp.closed}}">
<div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 16px 18px; border-radius: 16px; background: {{theme.tint}}; border: 2px solid {{theme.c1}}">
<span style="width: 44px; height: 44px; border-radius: 12px; background: {{theme.c1}}; color: {{theme.on1}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span>
<span style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Skip the setup: bring in your timetable</span><span style="font-size: 14px; line-height: 1.5; color: #34463F">Upload your timetable or handbooks and Unizy picks your modules, adds every class, deadline and exam, and files handbook notes, in about 30 seconds. Or connect your Moodle, Canvas or Blackboard calendar (or an .ics file) so it stays in sync.</span></span>
<span style="display: flex; gap: 8px; flex-wrap: wrap"><button onClick="{{cx.imp.show}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 12px 20px; min-height: 46px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Upload it</button><button onClick="{{cx.feeds.show}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 12px 18px; min-height: 46px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">Connect uni calendar</button></span>
</div>
</sc-if>
<sc-if value="{{cx.feeds.open}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 2px solid {{theme.c1}}; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; gap: 12px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5D6D67">Calendar sync</span>
<h2 style="margin: 0; font-size: 21px; font-weight: 800; line-height: 1.25">Connect your uni calendar</h2>
</div>
<button onClick="{{cx.feeds.hide}}" aria-label="Close" style="font: inherit; font-size: 22px; width: 40px; height: 40px; border-radius: 10px; border: none; background: none; color: #17302A; cursor: pointer; flex: 0 0 auto">×</button>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #34463F">{{cx.feeds.intro}}</p>
<sc-if value="{{cx.feeds.signedOut}}">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px; border-radius: 14px; background: #F4F4EF"><span style="flex: 1 1 220px; font-size: 14px">Log in so Unizy can keep your calendar in sync on every device.</span><button onClick="{{cx.feeds.login}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Log in</button></div>
</sc-if>
<sc-if value="{{cx.feeds.signedIn}}">
<sc-if value="{{cx.feeds.has}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{cx.feeds.list}}" as="fd" hint-placeholder-count="1">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px; border-radius: 14px; border: 1px solid #E2E7E3">
<span style="font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: {{theme.tint}}">{{fd.source}}</span>
<span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{fd.name}}</span><span style="font-size: 12px; color: {{fd.metaColor}}; line-height: 1.4">{{fd.meta}}</span></span>
<sc-if value="{{fd.canSync}}"><button onClick="{{fd.sync}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">{{fd.syncLabel}}</button></sc-if>
<button onClick="{{fd.remove}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: 1.5px solid #D6DDD8; background: #FFFFFF; color: #34463F; cursor: pointer">Disconnect</button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{cx.feeds.notAdding}}"><button onClick="{{cx.feeds.startAdd}}" style="font: inherit; font-size: 14px; font-weight: 700; align-self: flex-start; padding: 9px 14px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">+ Connect another calendar</button></sc-if>
<sc-if value="{{cx.feeds.adding}}">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700">Calendar link (iCal / webcal)</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<input data-cx-feed-url type="url" inputmode="url" autocomplete="off" value="{{cx.feeds.url}}" onChange="{{cx.feeds.onUrl}}" onKeyDown="{{cx.feeds.onUrlKey}}" placeholder="https://… or webcal://…" style="font: inherit; font-size: 15px; padding: 11px 12px; border-radius: 12px; border: 1.5px solid #C8D1CB; min-height: 46px; box-sizing: border-box; flex: 1 1 240px; min-width: 0">
<button onClick="{{cx.feeds.add}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 11px 18px; min-height: 46px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">{{cx.feeds.addLabel}}</button>
</div></label>
</sc-if>
<sc-if value="{{cx.feeds.hasMsg}}"><div role="status" style="font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: {{cx.feeds.msgBg}}">{{cx.feeds.msg}}</div></sc-if>
<label style="position: relative; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 2px dashed #B9C4BE; background: #FAFBFA; cursor: pointer"><input type="file" accept=".ics,text/calendar" onChange="{{cx.feeds.onIcs}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">Or upload a calendar file (.ics)</span><span style="font-size: 12px; color: #5D6D67">Downloaded from your online timetable, Outlook or Google Calendar. It’s a one-off import: upload a new file if your timetable changes.</span></span></label>
<button onClick="{{cx.feeds.toggleHow}}" style="font: inherit; font-size: 14px; font-weight: 700; text-align: left; align-self: flex-start; border: none; background: none; padding: 4px 0; color: #17302A; text-decoration: underline; cursor: pointer">Where do I find my calendar link?</button>
<sc-if value="{{cx.feeds.howOpen}}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #FAFBFA; border: 1px solid #EEF1EE">
<sc-for list="{{cx.feeds.how}}" as="hw" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">{{hw.h}}</span><span style="font-size: 13px; line-height: 1.5; color: #34463F">{{hw.t}}</span></div></sc-for>
</div>
</sc-if>
<span style="font-size: 12px; line-height: 1.5; color: #5D6D67">{{cx.feeds.privacy}}</span>
</sc-if>
</section>
</sc-if>
<sc-if value="{{cx.imp.open}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 2px solid {{theme.c1}}; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; gap: 12px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5D6D67">1-click setup</span>
<h2 style="margin: 0; font-size: 21px; font-weight: 800; line-height: 1.25">Upload your timetable or module handbook</h2>
</div>
<button onClick="{{cx.imp.hide}}" aria-label="Close" style="font: inherit; font-size: 22px; width: 40px; height: 40px; border-radius: 10px; border: none; background: none; color: #17302A; cursor: pointer; flex: 0 0 auto">×</button>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #34463F">{{cx.imp.intro}}</p>
<sc-if value="{{cx.imp.signedOut}}">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px; border-radius: 14px; background: #F4F4EF">
<span style="flex: 1 1 220px; font-size: 14px; line-height: 1.5">Sign up free (or log in) to use 1-click setup. Your new account comes with a free Pro trial.</span>
<button onClick="{{cx.imp.signup}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Sign up free</button>
<button onClick="{{cx.imp.login}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">Log in</button>
</div>
</sc-if>
<sc-if value="{{cx.imp.signedIn}}">
<sc-if value="{{cx.imp.isPick}}">
<label style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 26px 16px; border-radius: 16px; border: 2px dashed #B9C4BE; background: #FAFBFA; cursor: pointer; text-align: center">
<input type="file" accept="application/pdf,image/*" multiple onChange="{{cx.imp.onFiles}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
<span style="font-size: 16px; font-weight: 800">Choose a PDF or screenshots</span>
<span style="font-size: 13px; color: #5D6D67">{{cx.imp.hint}}</span>
</label>
<sc-if value="{{cx.imp.hasFiles}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{cx.imp.files}}" as="ff" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid #E2E7E3">
<span style="font-size: 11px; font-weight: 800; padding: 4px 7px; border-radius: 8px; background: {{theme.tint}}">{{ff.icon}}</span>
<span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ff.name}}</span>
<span style="font-size: 12px; color: #5D6D67">{{ff.size}}</span>

</sc-for>
</div>
<sc-if value="{{mp.hasDue}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-radius: 12px; background: #F5F8FF; border: 1.5px solid #1D3F8F; padding: 10px 12px"><span style="font-size: 14px; font-weight: 600; line-height: 1.5; flex: 1 1 240px">{{mp.dueText}}</span><button onClick="{{mp.goDue}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: none; background: #1D3F8F; color: #FFFFFF; cursor: pointer">Start the check</button></div></sc-if>
<sc-if value="{{mp.hasEv}}" hint-placeholder-val="{{ false }}"><details style="border-top: 1px solid #EEF1EE; padding-top: 8px"><summary style="cursor: pointer; font-size: 13px; font-weight: 800">Your learning evidence</summary><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 8px"><sc-for list="{{mp.ev}}" as="evx" hint-placeholder-count="3"><div style="border: 1px solid #E2E7E3; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 800">{{evx.v}}</span><span style="font-size: 13px; font-weight: 700">{{evx.label}}</span><span style="font-size: 12px; color: #5D6D67">{{evx.sub}}</span></div></sc-for></div><p style="margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: #5D6D67">Only first attempts count. The aim: the second and third numbers should match or beat the first, which shows you can apply ideas to new cases rather than remember particular questions.</p></details></sc-if>
</section>

<section style="background: #FFFFFF; border-radius: 18px; padding: 20px 22px; border: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 14px">
<div><span style="font-size: 12px; font-weight: 700; color: #5D6D67">{{mp.topicNo}}</span><h3 style="margin: 2px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">{{mp.topicName}}</h3></div>

</sc-for>

</div></sc-if>

<sc-if value="{{rm.room.loading}}"><div style="padding: 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E7E3; font-size: 15px; color: #34463F">Opening the room…</div></sc-if>
<sc-if value="{{rm.room.ready}}">
<section style="background: #17302A; color: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<button onClick="{{rm.room.back}}" style="font: inherit; font-size: 13px; font-weight: 700; align-self: flex-start; border: none; background: none; color: #B8862F; padding: 0; cursor: pointer">← All rooms</button>
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 800; line-height: 1.15">{{rm.room.name}}</h2>
<span style="font-size: 13px; opacity: 0.85">{{rm.room.module}} · {{rm.room.onlineText}}</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<button onClick="{{rm.room.copyCode}}" style="font: inherit; font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 999px; border: none; background: #B8862F; color: #17302A; cursor: pointer; letter-spacing: 0.06em">Code {{rm.room.code}} · Copy invite</button>
<sc-if value="{{rm.room.isOwner}}"><button onClick="{{rm.room.toggleOpen}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 999px; border: 1.5px solid #FFFFFF; background: none; color: #FFFFFF; cursor: pointer">{{rm.room.openText}}</button></sc-if>
<button onClick="{{rm.room.leave}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 999px; border: none; background: none; color: #FFB4B4; cursor: pointer">{{rm.room.leaveLabel}}</button>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{rm.room.members}}" as="mb" hint-placeholder-count="3"><span title="{{mb.title}}" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 9px 4px 4px; border-radius: 999px; background: rgba(255,255,255,0.1)"><span style="width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; color: #17302A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; position: relative">{{mb.initial}}<span style="position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 999px; background: {{mb.dot}}; border: 2px solid #17302A"></span></span>{{mb.name}}</span></sc-for>
</div>
</section>
<sc-if value="{{rm.room.liveBanner}}"><button onClick="{{rm.room.goQuiz}}" style="font: inherit; text-align: left; font-size: 15px; font-weight: 800; padding: 12px 16px; border-radius: 14px; border: none; background: #C8102E; color: #FFFFFF; cursor: pointer">● {{rm.room.liveText}}. Join the live quiz →</button></sc-if>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{rm.room.subs}}" as="sb" hint-placeholder-count="4"><button onClick="{{sb.pick}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 2px solid {{sb.border}}; background: {{sb.bg}}; color: {{sb.fg}}; cursor: pointer">{{sb.label}}</button></sc-for></div>

<sc-if value="{{rm.room.isNotes}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; border: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; line-height: 1.5; color: #5D6D67">{{rm.room.notesHelp}}</span>
<sc-for list="{{rm.room.blocks}}" as="bl" hint-placeholder-count="3">
<div style="border-radius: 12px; border: 2px solid {{bl.border}}; background: {{bl.bg}}; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{bl.viewing}}">
<button onClick="{{bl.edit}}" style="font: inherit; text-align: left; border: none; background: none; padding: 0; color: #17302A; cursor: text; display: flex; flex-direction: column; gap: 3px">
<sc-if value="{{bl.isH}}"><span style="font-size: 19px; font-weight: 800; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere">{{bl.body}}</span></sc-if>
<sc-if value="{{bl.isP}}"><span style="font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; color: #1E362F">{{bl.body}}</span></sc-if>
</button>
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 11px; font-weight: 600; color: #6A7A73; flex: 1 1 auto">{{bl.meta}}</span>
<sc-if value="{{bl.free}}"><button onClick="{{bl.addBelow}}" style="font: inherit; font-size: 11px; font-weight: 700; border: none; background: none; color: #34463F; cursor: pointer; padding: 0">+ Section below</button><button onClick="{{bl.remove}}" style="font: inherit; font-size: 11px; font-weight: 700; border: none; background: none; color: #9A1B12; cursor: pointer; padding: 0">Remove</button></sc-if>
</div>
</sc-if>
<sc-if value="{{bl.editing}}">
<textarea data-rm-block="{{bl.attr}}" rows="4" value="{{bl.text}}" onChange="{{bl.onInput}}" aria-label="Section text" style="font: inherit; font-size: 15px; line-height: 1.55; padding: 8px 10px; border-radius: 10px; border: 1.5px solid #C8D1CB; box-sizing: border-box; width: 100%; resize: vertical"></textarea>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<button onClick="{{bl.done}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Done</button>
<button onClick="{{bl.toggleKind}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1.5px solid #D6DDD8; background: #FFFFFF; color: #17302A; cursor: pointer">{{bl.kindLabel}}</button>
<span style="font-size: 11px; color: #6A7A73">Saves as you type. Others see “you’re writing”.</span>
</div>
</sc-if>
</div>
</sc-for>
<div style="display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px">
<button onClick="{{rm.room.addSection}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">+ Section</button>
<button onClick="{{rm.room.addHeading}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: 1.5px solid #D6DDD8; background: #FFFFFF; color: #17302A; cursor: pointer">+ Heading</button>
<button onClick="{{rm.room.copyNotes}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Save a copy to my notes</button>
</div>
</section>
</sc-if>

<sc-if value="{{rm.room.isVault}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; border: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline"><h3 style="margin: 0; font-size: 17px; font-weight: 800">Pooled flashcards</h3><span style="font-size: 13px; color: #5D6D67">{{rm.room.vaultCount}}</span></div>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{rm.room.topics}}" as="tp" hint-placeholder-count="3"><button onClick="{{tp.pick}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1.5px solid {{tp.border}}; background: {{tp.bg}}; color: {{tp.fg}}; cursor: pointer">{{tp.label}}</button></sc-for></div>
<sc-if value="{{rm.room.studying}}">
<div style="display: flex; flex-direction: column; gap: 10px; align-items: stretch">
<button onClick="{{rm.room.flip}}" style="font: inherit; text-align: center; min-height: 160px; padding: 22px; border-radius: 16px; border: 2px solid {{theme.c1}}; background: {{theme.tint}}; color: #17302A; cursor: pointer; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5D6D67">{{rm.room.sc.num}}</span>
<sc-if value="{{rm.room.sc.front}}"><span style="font-size: 19px; font-weight: 800; line-height: 1.35">{{rm.room.sc.f}}</span><span style="font-size: 12px; color: #5D6D67">Tap to flip</span></sc-if>
<sc-if value="{{rm.room.sc.flipped}}"><span style="font-size: 16px; line-height: 1.55; white-space: pre-wrap">{{rm.room.sc.b}}</span></sc-if>
</button>
<div style="display: flex; gap: 8px"><button onClick="{{rm.room.nextCard}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Next card</button><button onClick="{{rm.room.stopStudy}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">Stop</button></div>
</div>
</sc-if>
<sc-if value="{{rm.room.notStudying}}">
<sc-if value="{{rm.room.hasCards}}"><div style="display: flex; gap: 8px; flex-wrap: wrap"><button onClick="{{rm.room.study}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Study these</button><button onClick="{{rm.room.saveAll}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">{{rm.room.saveAllLabel}}</button></div></sc-if>
<sc-if value="{{rm.room.noCards}}"><span style="font-size: 14px; color: #34463F">The vault is empty. Add a set of your cards below, tagged with the seminar or topic, so everyone can use them.</span></sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px">
<sc-for list="{{rm.room.cards}}" as="cd" hint-placeholder-count="3"><div style="border: 1.5px solid #E2E7E3; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; background: #FAFBFA"><span style="font-size: 14px; font-weight: 700">{{cd.f}}</span><span style="font-size: 13px; line-height: 1.45; color: #34463F">{{cd.b}}</span><span style="display: flex; gap: 8px; align-items: center"><span style="font-size: 11px; color: #6A7A73; flex: 1 1 auto">{{cd.meta}}</span><sc-if value="{{cd.mine}}"><button onClick="{{cd.remove}}" aria-label="Remove card" style="font: inherit; font-size: 14px; border: none; background: none; color: #6A7A73; cursor: pointer">×</button></sc-if></span></div></sc-for>
</div>
<span style="font-size: 12px; color: #5D6D67">{{rm.room.moreCards}}</span>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #FAFBFA; border: 1px solid #EEF1EE">
<span style="font-size: 14px; font-weight: 800">Add your cards</span>
<sc-if value="{{rm.room.hasSets}}"><div style="display: flex; gap: 6px; flex-wrap: wrap; max-height: 140px; overflow-y: auto"><sc-for list="{{rm.room.sets}}" as="cs" hint-placeholder-count="3"><button onClick="{{cs.pick}}" style="font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; border: 2px solid {{cs.border}}; background: {{cs.bg}}; color: #17302A; cursor: pointer">{{cs.label}}</button></sc-for></div></sc-if>
<sc-if value="{{rm.room.noSets}}"><span style="font-size: 13px; color: #5D6D67">You don’t have flashcards for this module yet. Make some in Revise first, or build a lecture pack in Learn.</span></sc-if>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><input data-rm-topic type="text" maxlength="80" value="{{rm.room.newTopic}}" onChange="{{rm.room.onNewTopic}}" placeholder="Seminar or topic, e.g. Seminar 5: Game theory" aria-label="Seminar or topic" style="font: inherit; font-size: 14px; padding: 9px 11px; border-radius: 10px; border: 1.5px solid #C8D1CB; flex: 1 1 220px; min-width: 0"><button onClick="{{rm.room.addCards}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Add to vault</button></div>
</div>
</section>
</sc-if>

<sc-if value="{{rm.room.isReading}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; border: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: 17px; font-weight: 800">Split the reading</h3>
<span style="font-size: 13px; line-height: 1.5; color: #5D6D67">Add the readings, take one each, then write a short summary for the group.</span>
<sc-if value="{{rm.room.noReadings}}"><span style="font-size: 14px; color: #34463F">No readings yet.</span></sc-if>
<sc-for list="{{rm.room.weeks}}" as="wk" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #5D6D67; padding: 6px 0">{{wk.name}}</span>
<sc-for list="{{wk.items}}" as="rd" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid #EEF1EE">
<div style="display: flex; gap: 10px; align-items: flex-start">
<button onClick="{{rd.toggleDone}}" aria-label="Mark read" style="width: 24px; height: 24px; border-radius: 6px; border: 2px solid {{rd.boxBorder}}; background: {{rd.boxBg}}; color: {{rd.boxFg}}; font-size: 13px; font-weight: 800; cursor: pointer; flex: 0 0 auto; padding: 0">{{rd.box}}</button>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto"><span style="font-size: 14px; font-weight: 700; line-height: 1.35">{{rd.title}}</span><sc-if value="{{rd.hasDetail}}"><span style="font-size: 12px; color: #5D6D67">{{rd.detail}}</span></sc-if><span style="font-size: 12px; font-weight: 700; color: #34463F">{{rd.who}}</span></span>
<button onClick="{{rd.claim}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1.5px solid #D6DDD8; background: #FFFFFF; color: #17302A; cursor: pointer; white-space: nowrap">{{rd.claimLabel}}</button>
</div>
<div style="display: flex; gap: 10px; padding-left: 34px; flex-wrap: wrap"><button onClick="{{rd.toggleSum}}" style="font: inherit; font-size: 12px; font-weight: 700; border: none; background: none; padding: 0; color: #17302A; text-decoration: underline; cursor: pointer">{{rd.sumLabel}}</button><sc-if value="{{rd.canRemove}}"><button onClick="{{rd.remove}}" style="font: inherit; font-size: 12px; font-weight: 700; border: none; background: none; padding: 0; color: #9A1B12; cursor: pointer">Remove</button></sc-if></div>
<sc-if value="{{rd.open}}"><div style="padding-left: 34px; display: flex; flex-direction: column; gap: 6px"><textarea data-rm-sum="{{rd.attr}}" rows="4" value="{{rd.draft}}" onChange="{{rd.onSum}}" aria-label="Summary" placeholder="Key argument, evidence, and what it means for the seminar question" style="font: inherit; font-size: 14px; line-height: 1.5; padding: 8px 10px; border-radius: 10px; border: 1.5px solid #C8D1CB; box-sizing: border-box; width: 100%; resize: vertical"></textarea><button onClick="{{rd.saveSum}}" style="font: inherit; font-size: 13px; font-weight: 700; align-self: flex-start; padding: 7px 14px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Share summary</button></div></sc-if>
<sc-if value="{{rd.closed}}"><sc-if value="{{rd.hasSummary}}"><span style="padding-left: 34px; font-size: 13px; line-height: 1.5; color: #34463F; white-space: pre-wrap">{{rd.summary}}</span></sc-if></sc-if>
</div>
</sc-for>
</div>
</sc-for>
<div style="display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; border-radius: 14px; background: #FAFBFA; border: 1px solid #EEF1EE">
<input data-rm-rtitle type="text" maxlength="300" value="{{rm.room.rdTitle}}" onChange="{{rm.room.onRdTitle}}" placeholder="Reading, e.g. Varian ch. 5" aria-label="Reading" style="font: inherit; font-size: 14px; padding: 9px 11px; border-radius: 10px; border: 1.5px solid #C8D1CB; flex: 2 1 220px; min-width: 0">
<input data-rm-rweek type="text" maxlength="80" value="{{rm.room.rdWeek}}" onChange="{{rm.room.onRdWeek}}" placeholder="Week or seminar" aria-label="Week" style="font: inherit; font-size: 14px; padding: 9px 11px; border-radius: 10px; border: 1.5px solid #C8D1CB; flex: 1 1 120px; min-width: 0">
<button onClick="{{rm.room.addReading}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Add</button>
</div>
<sc-if value="{{rm.room.canImport}}">
<button onClick="{{rm.room.startImport}}" style="font: inherit; font-size: 13px; font-weight: 700; align-self: flex-start; padding: 8px 14px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">Import from the {{activeMod.code}} reading list</button>
<sc-if value="{{rm.room.importing}}">
<sc-if value="{{rm.room.hasRl}}"><span style="font-size: 13px; color: #34463F">Pick a section to add its readings:</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{rm.room.rlSections}}" as="rs" hint-placeholder-count="3"><button onClick="{{rs.pick}}" style="font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; border: 1.5px solid #D6DDD8; background: #FFFFFF; color: #17302A; cursor: pointer">{{rs.label}} ({{rs.n}})</button></sc-for></div></sc-if>
<sc-if value="{{rm.room.rlEmpty}}"><span style="font-size: 13px; color: #34463F">No reading list is published for {{activeMod.code}} yet.</span></sc-if>
</sc-if>
</sc-if>
</section>
</sc-if>

<sc-if value="{{rm.room.isQuiz}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; border: 1px solid #E2E7E3; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{rm.room.noQuiz}}">
<h3 style="margin: 0; font-size: 17px; font-weight: 800">Run a live quiz</h3>
<span style="font-size: 13px; line-height: 1.5; color: #5D6D67">Everyone in the room answers the same question at the same time. Faster right answers score more, and scores count towards the {{activeMod.code}} benchmark.</span>
<sc-if value="{{rm.room.quizDone}}">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: {{theme.tint}}"><span style="font-size: 14px; font-weight: 800">Results: {{rm.room.q.title}}</span><sc-for list="{{rm.room.q.board}}" as="lb" hint-placeholder-count="3"><div style="display: flex; gap: 10px; font-size: 14px; font-weight: {{lb.weight}}"><span style="width: 20px">{{lb.rank}}</span><span style="flex: 1 1 auto">{{lb.name}}</span><span>{{lb.correct}}</span><span style="width: 70px; text-align: right">{{lb.points}}</span></div></sc-for><span style="font-size: 12px; color: #5D6D67">{{rm.room.q.doneNote}}</span></div>
</sc-if>
<sc-if value="{{rm.room.hasQTopics}}"><span style="font-size: 13px; font-weight: 700">Topic</span><div style="display: flex; gap: 6px; flex-wrap: wrap; max-height: 150px; overflow-y: auto"><sc-for list="{{rm.room.qTopics}}" as="qt" hint-placeholder-count="3"><button onClick="{{qt.pick}}" style="font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; border: 2px solid {{qt.border}}; background: {{qt.bg}}; color: #17302A; cursor: pointer">{{qt.label}}</button></sc-for></div></sc-if>
<sc-if value="{{rm.room.noQTopics}}"><span style="font-size: 13px; color: #5D6D67">There aren’t multiple-choice questions for this module yet. Build a lecture pack in Learn or take a topic test first.</span></sc-if>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{rm.room.qSizes}}" as="qn" hint-placeholder-count="3"><button onClick="{{qn.pick}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1.5px solid {{qn.border}}; background: {{qn.bg}}; color: {{qn.fg}}; cursor: pointer">{{qn.label}}</button></sc-for><sc-for list="{{rm.room.qTimes}}" as="qs" hint-placeholder-count="3"><button onClick="{{qs.pick}}" style="font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1.5px solid {{qs.border}}; background: {{qs.bg}}; color: {{qs.fg}}; cursor: pointer">{{qs.label}}</button></sc-for></div>
<button onClick="{{rm.room.startQuiz}}" style="font: inherit; font-size: 15px; font-weight: 800; align-self: flex-start; padding: 12px 22px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Set up the quiz</button>
</sc-if>
<sc-if value="{{rm.room.hasQuiz}}">
<div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline"><h3 style="margin: 0; font-size: 17px; font-weight: 800">{{rm.room.q.title}}</h3><sc-if value="{{rm.room.q.host}}"><button onClick="{{rm.room.q.end}}" style="font: inherit; font-size: 12px; font-weight: 700; border: none; background: none; color: #9A1B12; cursor: pointer">End quiz</button></sc-if></div>
<sc-if value="{{rm.room.q.isLobby}}">
<span style="font-size: 14px; color: #34463F">Waiting in the lobby. Everyone here now will play:</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{rm.room.q.players}}" as="pl" hint-placeholder-count="3"><span style="font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: {{theme.tint}}">{{pl.name}}</span></sc-for></div>
<sc-if value="{{rm.room.q.host}}"><button onClick="{{rm.room.q.start}}" style="font: inherit; font-size: 16px; font-weight: 800; align-self: flex-start; padding: 12px 24px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Start now</button></sc-if>
<sc-if value="{{rm.room.q.notHost}}"><span style="font-size: 13px; color: #5D6D67">{{rm.room.q.hostName}} will start it.</span></sc-if>
</sc-if>
<sc-if value="{{rm.room.q.isQuestion}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #5D6D67">{{rm.room.q.num}}</span><span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums"><span data-rm-clock>{{rm.room.q.secs}}</span>s</span></div>

</sc-if>
</sc-if>
</sc-if>
</div>
</sc-if>

</sc-if>
</article>

<span style="font-size: 12px; line-height: 1.5; color: #5D6D67">{{cx.hub.rules}}</span>

</div>
</sc-if>
<sc-if value="{{cx.ver.pending}}">
<span style="font-size: 14px; font-weight: 600">{{cx.ver.pendingText}}</span>

<input data-cx-vcode type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{cx.ver.code}}" onChange="{{cx.ver.onCode}}" onKeyDown="{{cx.ver.onCodeKey}}" placeholder="6-digit code" aria-label="6-digit code" style="font: inherit; font-size: 20px; font-weight: 800; letter-spacing: 0.2em; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #C8D1CB; min-height: 46px; box-sizing: border-box; width: 190px; max-width: 100%">
<button onClick="{{cx.ver.check}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">{{cx.ver.checkLabel}}</button>
</div>
<div style="display: flex; gap: 14px; flex-wrap: wrap"><button onClick="{{cx.ver.send}}" style="font: inherit; font-size: 13px; font-weight: 700; border: none; background: none; padding: 4px 0; color: #17302A; text-decoration: underline; cursor: pointer">{{cx.ver.sendLabel}}</button><button onClick="{{cx.ver.restart}}" style="font: inherit; font-size: 13px; font-weight: 700; border: none; background: none; padding: 4px 0; color: #17302A; text-decoration: underline; cursor: pointer">Use a different email</button></div>
</sc-if>
<sc-if value="{{cx.ver.hasMsg}}"><div role="status" style="font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: {{cx.ver.msgBg}}">{{cx.ver.msg}}</div></sc-if>

<sc-if value="{{cx.mkt.loading}}"><div style="padding: 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E7E3; font-size: 15px; color: #34463F">Loading the marketplace…</div></sc-if>
<sc-if value="{{cx.mkt.hasMsg}}"><div role="status" style="display: flex; gap: 10px; align-items: center; font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: {{cx.mkt.msgBg}}"><span style="flex: 1 1 auto">{{cx.mkt.msg}}</span><button onClick="{{cx.mkt.clearMsg}}" aria-label="Dismiss" style="font: inherit; font-size: 18px; border: none; background: none; cursor: pointer">×</button></div></sc-if>

<sc-if value="{{cx.mkt.isBrowse}}">

<input data-cx-mq type="search" value="{{cx.mkt.q}}" onChange="{{cx.mkt.onQ}}" onKeyDown="{{cx.mkt.onQKey}}" placeholder="Search books, kit, module codes…" aria-label="Search the marketplace" style="font: inherit; font-size: 15px; border: none; outline: none; flex: 1 1 auto; min-width: 0; background: transparent">

<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{cx.mkt.cats}}" as="mc" hint-placeholder-count="6"><button onClick="{{mc.pick}}" style="font: inherit; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 1.5px solid {{mc.border}}; background: {{mc.bg}}; color: {{mc.fg}}; cursor: pointer">{{mc.label}}</button></sc-for></div>
<sc-if value="{{cx.mkt.empty}}"><section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 1.5px dashed #C8D1CB; display: flex; flex-direction: column; gap: 12px; align-items: flex-start"><span style="font-size: 15px; line-height: 1.6; color: #34463F">{{cx.mkt.emptyText}}</span><button onClick="{{cx.mkt.sell}}" style="font: inherit; font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">List something</button></section></sc-if>

<span style="font-size: 17px; font-weight: 800">{{ml.price}}</span>

<span style="font-size: 12px; color: #5D6D67; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ml.meta}}</span>
<span style="font-size: 12px; color: #5D6D67">{{ml.seller}}</span>
</span>
</button>
</sc-for>
</div>
<span style="font-size: 12px; line-height: 1.5; color: #5D6D67">{{cx.mkt.safety}}</span>
</sc-if>

<button onClick="{{cx.mkt.back}}" style="font: inherit; font-size: 14px; font-weight: 700; align-self: flex-start; border: none; background: none; padding: 4px 0; color: #17302A; cursor: pointer">← Back to listings</button>

<span style="font-size: 24px; font-weight: 800">{{cx.mkt.cur.price}}</span>
</div>

<textarea data-cx-contact rows="3" value="{{cx.mkt.contactText}}" onChange="{{cx.mkt.onContact}}" aria-label="Message" style="font: inherit; font-size: 15px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #C8D1CB; box-sizing: border-box; width: 100%; resize: vertical"></textarea>
<button onClick="{{cx.mkt.contact}}" style="font: inherit; font-size: 15px; font-weight: 700; align-self: flex-start; padding: 11px 18px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">{{cx.mkt.contactLabel}}</button>
</div>
</sc-if>
<sc-if value="{{cx.mkt.cur.hasThread}}"><button onClick="{{cx.mkt.openMyThread}}" style="font: inherit; font-size: 15px; font-weight: 700; align-self: flex-start; padding: 11px 18px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">Open your conversation</button></sc-if>
<sc-if value="{{cx.mkt.cur.isHousing}}"><div style="font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: #FFF4D6; color: #3D2E00">Rooms: view in person before paying anything, check the landlord allows sub-letting, and get the agreement in writing.</div></sc-if>

</sc-if>

</section>

<sc-if value="{{cx.mkt.isSell}}">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; border: 2px solid {{theme.c1}}; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><h2 style="margin: 0; font-size: 20px; font-weight: 800">{{cx.mkt.formTitle}}</h2><button onClick="{{cx.mkt.cancelSell}}" aria-label="Cancel" style="font: inherit; font-size: 22px; border: none; background: none; cursor: pointer; width: 36px; height: 36px">×</button></div>

</div>

<label style="display: flex; flex-direction: column; gap: 6px; flex: 2 1 220px"><span style="font-size: 13px; font-weight: 700">Pick-up or area</span><input data-cx-m-location type="text" maxlength="80" value="{{cx.mkt.fLocation}}" onChange="{{cx.mkt.onLocation}}" placeholder="{{cx.mkt.locPh}}" style="font: inherit; font-size: 15px; padding: 11px 12px; border-radius: 12px; border: 1.5px solid #C8D1CB; min-height: 46px; box-sizing: border-box; width: 100%"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700">Description</span><textarea data-cx-m-description rows="5" maxlength="3000" value="{{cx.mkt.fDesc}}" onChange="{{cx.mkt.onDesc}}" placeholder="{{cx.mkt.descPh}}" style="font: inherit; font-size: 15px; line-height: 1.5; padding: 11px 12px; border-radius: 12px; border: 1.5px solid #C8D1CB; box-sizing: border-box; width: 100%; resize: vertical"></textarea></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700">Photos (up to 4)</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<sc-for list="{{cx.mkt.photosList}}" as="pp" hint-placeholder-count="2"><span style="position: relative; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; background: #F4F4EF; flex: 0 0 auto"><img src="{{pp.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"><button onClick="{{pp.remove}}" aria-label="Remove photo" style="position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 999px; border: none; background: rgba(0,0,0,0.7); color: #FFFFFF; font-size: 14px; cursor: pointer">×</button></span></sc-for>
<sc-if value="{{cx.mkt.canAddPhoto}}"><label style="position: relative; width: 92px; height: 92px; border-radius: 12px; border: 2px dashed #B9C4BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-size: 12px; font-weight: 700; color: #34463F; flex: 0 0 auto"><input type="file" accept="image/*" multiple onChange="{{cx.mkt.onPhotos}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"><span style="font-size: 24px">+</span>Add photo</label></sc-if>
<sc-if value="{{cx.mkt.uploading}}"><span style="font-size: 13px; color: #34463F">{{cx.mkt.uploadingText}}</span></sc-if>

<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"><button onClick="{{cx.mkt.submit}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 12px 22px; min-height: 46px; border-radius: 999px; border: none; background: {{theme.btn}}; color: {{theme.onBtn}}; cursor: pointer">{{cx.mkt.submitLabel}}</button><button onClick="{{cx.mkt.cancelSell}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; border-radius: 999px; border: 1.5px solid #17302A; background: #FFFFFF; color: #17302A; cursor: pointer">Cancel</button></div>
<span style="font-size: 12px; line-height: 1.5; color: #5D6D67">Only verified {{uni.short}} students can see your listing. No weapons, alcohol, medicines, counterfeit items or exam papers. {{cx.mkt.safety}}</span>
</section>
</sc-if>

<sc-if value="{{cx.mkt.isInbox}}">
<button onClick="{{cx.mkt.back}}" style="font: inherit; font-size: 14px; font-weight: 700; align-self: flex-start; border: none; background: none; padding: 4px 0; color: #17302A; cursor: pointer">← Back to listings</button>
